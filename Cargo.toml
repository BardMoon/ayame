[workspace]
resolver = "3"

members = [
  #[ Qt ]
  "qt/ayame-settings",
  "qt/qml6",
  "qt/stylekit",
  # "qt/kdecoreation6",
  # "qt/kstyle6",
]

default-members = ["qt/qml6"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ayame = { path = "qt/qml6" }
ayame-stylekit = { path = "qt/stylekit" }
ayame-colors = { git = "https://github.com/BardMoon/origami-frameworks" }
ayame-config = { git = "https://github.com/BardMoon/origami-frameworks" }
ayame-icons = { git = "https://github.com/BardMoon/origami-frameworks" }

#[ Crates.io ]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = "0.9"
cxx-qt-build = "0.9"
qt-build-utils = "0.9.1"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
time = "0.3"
toml = "0.8"
